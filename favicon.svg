<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2997FF"/>
      <stop offset="50%" stop-color="#0071E3"/>
      <stop offset="100%" stop-color="#0047AB"/>
    </linearGradient>
    <linearGradient id="innerGlow" x1="16" y1="12" x2="48" y2="52" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#64D2FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#2997FF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="64" height="64" rx="16" fill="#0D0E12"/>
  <rect width="64" height="64" rx="16" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  
  <!-- Outer Shield Path -->
  <path d="M32 10L48 16V29C48 40.5 41.2 50.8 32 54C22.8 50.8 16 40.5 16 29V16L32 10Z" 
        stroke="url(#shieldGrad)" stroke-width="2.5" stroke-linejoin="round" fill="none"/>
  
  <!-- Center AI Aperture / Optical Lens Core -->
  <circle cx="32" cy="28" r="8" stroke="url(#innerGlow)" stroke-width="2" />
  <circle cx="32" cy="28" r="3.5" fill="#64D2FF" filter="url(#glow)" />
  
  <!-- Tech Reticle Ticks -->
  <path d="M32 16V18M32 38V40M20 28H22M42 28H44" stroke="#64D2FF" stroke-width="1.8" stroke-linecap="round" opacity="0.8"/>
</svg>
